cf-argo-cd:
  enabled: true
argo-cd:
  global:
    domain: argocd.lowsandbox.com
    image:
      repository: quay.io/argoproj/argocd
      tag: ""
      imagePullPolicy: IfNotPresent
  #    extraVolumeMounts:
  #      - name: <PLACEHOLDER>
  #        mountPath: /var/log
  #        subPath: <PLACEHOLDER>
  #    extraVolumes:
  #      - name: <PLACEHOLDER>
  #        secret:
  #          secretName: <PLACEHOLDER>
  configs:
    params:
      server.insecure: true
  server:
    ingress:
      enabled: true
      # controller: generic
      # ingressClassName: haproxy
      controller: aws
      ingressController: aws
      pathType: Prefix
      path: /
      annotations:
        # nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
        # nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
        kubernetes.io/ingress.class: alb
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:726728011995:certificate/1632b387-345a-4518-a09e-362720af415a
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
      aws:
        serviceType: ClusterIP # <- Used with target-type: ip
        backendProtocolVersion: GRPC
#      extraTls:
#        - hosts:
#            - argocd.lowsandbox.com
# Based on the ingress controller used secret might be optional
#          secretName: lowsandbox-tls
