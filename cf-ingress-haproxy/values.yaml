cf-ingress-haproxy:
  enabled: true
kubernetes-ingress:
  controller:
    image:
      repository: haproxytech/kubernetes-ingress
      tag: ""
    kind: Deployment # consider using DaemonSet for better performance
    ingressClassName: haproxy
    logging:
      traffic:
        address: "stdout"
        format: "raw"
        facility: "daemon"
    service:
      type: LoadBalancer
      enablePorts: # disable ports that are not needed and may not be supported in TS
        quic: false
        admin: false
        stat: false
      annotations:
        #        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        #        service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
        service.beta.kubernetes.io/aws-load-balancer-type: "alb"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:726728011995:certificate/1632b387-345a-4518-a09e-362720af415a
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
